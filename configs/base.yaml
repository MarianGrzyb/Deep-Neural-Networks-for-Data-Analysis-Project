project:
  name: fetal-ultrasound-classification
  seed: 42

data:
  root: /content/data/Ultrasound Fetus Dataset/Ultrasound Fetus Dataset/Data/Data
  image_size: 224
  num_workers: 2

model:
  name: resnet18
  pretrained: true
  num_classes: 3

training:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.0001

logging:
  log_dir: runs
  artifact_dir: artifacts/sanity
